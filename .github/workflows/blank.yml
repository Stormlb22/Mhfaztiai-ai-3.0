name: Mahfazti APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android Studio project ZIP
        run: |
          set -e
          if [ -f "Mahfazti-AndroidStudio-Project (225).zip" ]; then
            ZIP="Mahfazti-AndroidStudio-Project (225).zip"
          elif [ -f "Mahfazti-AndroidStudio-Package(69).zip" ]; then
            ZIP="Mahfazti-AndroidStudio-Package(69).zip"
          else
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" ! -name "mahfazti-android-source*" -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          fi
          if [ -z "$ZIP" ]; then
            echo "No full Android Studio project ZIP found"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project
          echo "Project extracted from: $ZIP"
          find project -maxdepth 3 -type f | head -n 80

      - name: Locate Gradle project
        run: |
          set -e
          GRADLE_FILE=$(find project -type f -name settings.gradle -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find project -type f -name settings.gradle.kts -print -quit)
          fi
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle settings file not found in extracted ZIP"
            find project -maxdepth 5 -type f | head -n 150
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "gradlew not found in $PROJECT_DIR"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK using runner Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazti-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
