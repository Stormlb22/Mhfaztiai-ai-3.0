name: Mahfazti APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Mahfazti-AndroidStudio-Upgradedffffff.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract upgraded Android Studio project
        run: |
          set -euo pipefail
          ZIP="Mahfazti-AndroidStudio-Upgradedffffff.zip"
          test -f "$ZIP" || { echo "Project ZIP not found: $ZIP"; ls -lah; exit 1; }
          echo "Selected project archive: $ZIP"
          sha256sum "$ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project
          echo "Archive extracted successfully"
          find project -maxdepth 5 -type f | head -n 150

      - name: Locate Gradle project
        run: |
          set -euo pipefail
          GRADLE_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle settings file not found in extracted ZIP"
            find project -maxdepth 7 -type f | head -n 250
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper not found beside $GRADLE_FILE"
            find project -type f -name gradlew -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          find project -type f -path '*/build/outputs/apk/*/*.apk' -print
          APK_COUNT=$(find project -type f -path '*/build/outputs/apk/*/*.apk' | wc -l)
          test "$APK_COUNT" -gt 0 || { echo "No APK was generated"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazti-Upgradedffffff-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
