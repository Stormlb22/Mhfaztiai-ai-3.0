name: Mahfazti APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract upgraded Android Studio project ZIP
        run: |
          set -e
          ZIP="Mahfazti-AndroidStudio-Upgraded 666(1).zip"
          if [ ! -f "$ZIP" ]; then
            echo "Required project ZIP not found: $ZIP"
            ls -lah
            exit 1
          fi
          echo "Selected project archive: $ZIP"
          sha256sum "$ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project
          echo "Project extracted from: $ZIP"
          find project -maxdepth 4 -type f | head -n 120

      - name: Locate Gradle project
        run: |
          set -e
          GRADLE_FILE=$(find project -type f -name settings.gradle -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find project -type f -name settings.gradle.kts -print -quit)
          fi
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle settings file not found in extracted ZIP"
            find project -maxdepth 6 -type f | head -n 200
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "gradlew not found in $PROJECT_DIR"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK using runner Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazti-Upgraded-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
